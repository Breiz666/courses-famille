      <stop offset="0%" stop-color="#1c1310"/>
      <stop offset="100%" stop-color="#2a1f1a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)" rx="96"/>
  <!-- Frigo corps -->
