  <!-- Poignée porte haute -->
  <line x1="148" y1="150" x2="148" y2="200" stroke="#FFB347" stroke-width="12" stroke-linecap="round"/>
  <!-- Poignée porte basse -->
  <line x1="148" y1="260" x2="148" y2="380" stroke="#FFB347" stroke-width="12" stroke-linecap="round"/>
  <!-- Checkmark sur porte basse -->
  <path d="M 215 320 L 250 355 L 320 285" stroke="#FFB347" stroke-width="16" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
