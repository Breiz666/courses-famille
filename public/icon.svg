<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="diffuse" cx="50%" cy="46%" r="64%">
      <stop offset="0%" stop-color="#FFE596" stop-opacity="0.85"/>
      <stop offset="34%" stop-color="#FFC23E" stop-opacity="0.55"/>
      <stop offset="64%" stop-color="#FF9F1C" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#FF8C00" stop-opacity="0.03"/>
    </radialGradient>
    <radialGradient id="ring" cx="256" cy="250" r="262" gradientUnits="userSpaceOnUse">
      <stop offset="0.5" stop-color="#FFEAA0" stop-opacity="0"/>
      <stop offset="0.72" stop-color="#FFD86B" stop-opacity="0"/>
      <stop offset="0.83" stop-color="#FFE8A0" stop-opacity="0.75"/>
      <stop offset="0.92" stop-color="#FFC23E" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FF9F1C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD24D"/>
      <stop offset="100%" stop-color="#FF9500"/>
    </linearGradient>
  </defs>
  <!-- Fond sombre -->
  <rect width="512" height="512" rx="96" fill="#130b06"/>
  <!-- Glow doré diffus -->
  <rect width="512" height="512" rx="96" fill="url(#diffuse)"/>
  <!-- Couronne lumineuse autour du corps -->
  <rect width="512" height="512" rx="96" fill="url(#ring)"/>
  <!-- Corps du frigo -->
  <rect x="115" y="75" width="282" height="362" rx="32" fill="url(#body)"/>
  <!-- Séparation des 2 portes -->
  <rect x="115" y="210" width="282" height="16" fill="#1a0d06" opacity="0.55"/>
  <!-- Poignée porte haute -->
  <rect x="138" y="120" width="20" height="72" rx="10" fill="#1a0d06"/>
  <!-- Poignée porte basse -->
  <rect x="138" y="248" width="20" height="146" rx="10" fill="#1a0d06"/>
  <!-- Reflet en haut -->
  <rect x="120" y="80" width="272" height="14" rx="14" fill="rgba(255,255,255,0.35)"/>
</svg>
