<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="cart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)" rx="96"/>
  <!-- Handle (poignée du chariot) -->
  <path d="M 75 130 L 130 130 L 162 220" stroke="url(#cart)" stroke-width="24" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Cart body (corps du chariot - trapèze) -->
  <path d="M 145 200 L 412 200 L 380 345 L 175 345 Z" stroke="url(#cart)" stroke-width="24" fill="none" stroke-linejoin="round"/>
  <!-- Wheels -->
  <circle cx="210" cy="405" r="28" fill="url(#cart)"/>
  <circle cx="350" cy="405" r="28" fill="url(#cart)"/>
  <!-- Sparkle AI accent en haut à droite -->
  <g transform="translate(390, 110)">
    <path d="M 0 -22 L 5 -5 L 22 0 L 5 5 L 0 22 L -5 5 L -22 0 L -5 -5 Z" fill="#FFD700"/>
  </g>
  <!-- Mini sparkle -->
  <circle cx="350" cy="155" r="6" fill="#FFD700"/>
</svg>
