<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.4" r="0.75">
      <stop offset="0%" stop-color="#3a2418"/>
      <stop offset="100%" stop-color="#180c08"/>
    </radialGradient>
    <linearGradient id="fridge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFCD68"/>
      <stop offset="100%" stop-color="#FF9800"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FF9800" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FF9800" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Fond -->
  <rect width="512" height="512" fill="url(#bg)" rx="96"/>
  <!-- Halo derrière le frigo -->
  <ellipse cx="256" cy="260" rx="200" ry="220" fill="url(#glow)"/>
  <!-- Corps du frigo -->
  <rect x="125" y="95" width="262" height="330" rx="26" stroke="url(#fridge)" stroke-width="18" fill="rgba(255,180,0,0.08)"/>
  <!-- Séparation entre les 2 portes -->
  <line x1="125" y1="220" x2="387" y2="220" stroke="url(#fridge)" stroke-width="12"/>
  <!-- Poignée porte haute -->
  <line x1="148" y1="145" x2="148" y2="200" stroke="url(#fridge)" stroke-width="14" stroke-linecap="round"/>
  <!-- Poignée porte basse -->
  <line x1="148" y1="260" x2="148" y2="385" stroke="url(#fridge)" stroke-width="14" stroke-linecap="round"/>
  <!-- Checkmark vert vif sur porte basse -->
  <path d="M 210 320 L 250 360 L 325 280" stroke="#4ADE80" stroke-width="22" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Highlight blanc subtil en haut (effet lumière) -->
  <line x1="145" y1="115" x2="365" y2="115" stroke="rgba(255,255,255,0.3)" stroke-width="3" stroke-linecap="round"/>
</svg>
