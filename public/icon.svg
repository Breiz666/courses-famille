<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.4" r="0.75">
      <stop offset="0%" stop-color="#3a2418"/>
      <stop offset="100%" stop-color="#180c08"/>
    </radialGradient>
    <linearGradient id="fridge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FF8C00"/>
    </linearGradient>
    <linearGradient id="fridgeDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFA500"/>
      <stop offset="100%" stop-color="#FF8C00"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)" rx="96"/>

  <!-- Halo derrière -->
  <ellipse cx="256" cy="260" rx="220" ry="240" fill="#FF8C00" opacity="0.18"/>

  <!-- Corps du frigo : forme pleine (haute lisibilité même en mini) -->
  <rect x="115" y="75" width="282" height="362" rx="32" fill="url(#fridge)"/>

  <!-- Séparation entre les 2 portes : bande sombre épaisse pour contraster -->
  <rect x="115" y="210" width="282" height="18" fill="#180c08"/>

  <!-- Poignée porte haute : barre sombre épaisse -->
  <rect x="138" y="120" width="20" height="72" rx="10" fill="#180c08"/>

  <!-- Poignée porte basse : barre sombre épaisse -->
  <rect x="138" y="248" width="20" height="146" rx="10" fill="#180c08"/>

  <!-- Reflet/light en haut du frigo (effet 3D subtil) -->
  <rect x="120" y="80" width="272" height="14" rx="14" fill="rgba(255,255,255,0.35)"/>

  <!-- Gros checkmark vert vif sur porte basse -->
  <path d="M 196 326 L 246 378 L 348 270" stroke="#22C55E" stroke-width="32" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Ombre légère sous le check pour le faire ressortir -->
  <path d="M 200 332 L 250 384 L 352 276" stroke="rgba(0,0,0,0.25)" stroke-width="32" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
  <!-- Le vrai check par-dessus l'ombre -->
  <path d="M 196 326 L 246 378 L 348 270" stroke="#4ADE80" stroke-width="32" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
